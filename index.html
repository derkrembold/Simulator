<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TREI Prüfungs-Simulator</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    /* Eine Spalte für Handy und Desktop (sim-rng): Steckdosen, Schaltkasten,
       Messgerät, Werkzeugzeile und Prüfprotokoll untereinander. Auf dem
       Desktop zentriert und höchstens 780 px breit, auf dem Handy volle
       Breite. Die SVGs skalieren per CSS über ihre viewBox, die gerenderten
       SVGs selbst bleiben unverändert. */
    #spalte { max-width: 780px; margin: 0 auto; }
    #steckdosen svg, #schaltkasten svg { display: block; width: 100%; height: auto; }
    #schaltkasten { background: #fff; }
    #steckdosen { margin-bottom: 20px; }
    #messgeraet-zeile { margin-top: 20px; }
    /* Messgerät nie größer als seine gerenderte Breite (460 px), auf
       schmalen Bildschirmen volle Spaltenbreite. */
    #messgeraet { max-width: 460px; margin: 0 auto; }
    #messgeraet svg { display: block; width: 100%; height: auto; }
    /* Werkzeugzeile: Handy, Schraubendreher und weitere kleine Objekte
       nebeneinander. */
    #werkzeugzeile {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin-top: 16px;
    }
    #werkzeugzeile svg { display: block; }
    #protokoll { margin-top: 20px; }
    @media (max-width: 600px) {
      body { padding: 12px 6px; }
    }
    /* Schnelles Mehrfachklicken (Messspitzen-Zyklus, Drehknopf, ▲/▼/◄►) löst
       sonst die native Doppelklick-Textauswahl des Browsers aus, die zufällig
       Text irgendwo in der SVG markiert (z.B. "INSTALLATIONSTESTER" blau markiert). */
    #schaltkasten, #messgeraet-zeile {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
    .popup {
      position: fixed;
      display: none;
      background: #222;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      transform: translate(-50%, -120%);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="spalte">
    <div id="steckdosen"></div>
    <div id="schaltkasten"></div>
    <div id="messgeraet-zeile">
      <div id="messgeraet"></div>
      <div id="werkzeugzeile">
        <div id="handy"></div>
        <div id="schraubendreher"></div>
      </div>
    </div>
    <div id="protokoll"></div>
  </div>
  <script type="module" src="controller/app.js"></script>
</body>
</html>
